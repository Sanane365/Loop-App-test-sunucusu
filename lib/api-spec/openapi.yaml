openapi: 3.1.0
info:
  title: Api
  version: 0.1.0
  description: Loop Social Media API
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
  - name: auth
  - name: users
  - name: posts
  - name: stories
  - name: comments
  - name: chat
  - name: voice
  - name: notifications

paths:
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"

  /auth/me:
    get:
      operationId: getMe
      tags: [auth]
      summary: Get current authenticated user
      responses:
        "200":
          description: Current user
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/User"
        "401":
          description: Unauthorized

  /auth/login:
    post:
      operationId: login
      tags: [auth]
      summary: Login with username and password
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LoginInput"
      responses:
        "200":
          description: Logged in
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/User"
        "401":
          description: Invalid credentials

  /auth/register:
    post:
      operationId: register
      tags: [auth]
      summary: Register new user
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RegisterInput"
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/User"

  /auth/logout:
    post:
      operationId: logout
      tags: [auth]
      summary: Logout
      responses:
        "200":
          description: Logged out

  /users:
    get:
      operationId: listUsers
      tags: [users]
      summary: Search users
      parameters:
        - name: q
          in: query
          schema:
            type: string
      responses:
        "200":
          description: List of users
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/User"

  /users/{userId}:
    get:
      operationId: getUser
      tags: [users]
      summary: Get user profile
      parameters:
        - name: userId
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: User profile
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UserProfile"
        "404":
          description: Not found

  /users/{userId}/follow:
    post:
      operationId: followUser
      tags: [users]
      summary: Follow a user
      parameters:
        - name: userId
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Followed

  /users/{userId}/unfollow:
    post:
      operationId: unfollowUser
      tags: [users]
      summary: Unfollow a user
      parameters:
        - name: userId
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Unfollowed

  /users/me/profile:
    patch:
      operationId: updateProfile
      tags: [users]
      summary: Update current user profile
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ProfileUpdate"
      responses:
        "200":
          description: Updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/User"

  /users/me/avatar:
    post:
      operationId: uploadAvatar
      tags: [users]
      summary: Upload avatar image (multipart)
      responses:
        "200":
          description: Avatar URL
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UploadResult"

  /posts:
    get:
      operationId: listPosts
      tags: [posts]
      summary: Get feed posts
      parameters:
        - name: page
          in: query
          schema:
            type: integer
        - name: userId
          in: query
          schema:
            type: ["integer", "null"]
      responses:
        "200":
          description: Posts
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Post"
    post:
      operationId: createPost
      tags: [posts]
      summary: Create a new post
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PostInput"
      responses:
        "201":
          description: Created post
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Post"

  /posts/upload:
    post:
      operationId: uploadPostMedia
      tags: [posts]
      summary: Upload post image/video from gallery
      responses:
        "200":
          description: Media URL
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UploadResult"

  /posts/{postId}:
    get:
      operationId: getPost
      tags: [posts]
      summary: Get a single post
      parameters:
        - name: postId
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Post
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Post"
    delete:
      operationId: deletePost
      tags: [posts]
      summary: Delete a post
      parameters:
        - name: postId
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Deleted

  /posts/{postId}/like:
    post:
      operationId: likePost
      tags: [posts]
      summary: Like a post
      parameters:
        - name: postId
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Liked

  /posts/{postId}/unlike:
    post:
      operationId: unlikePost
      tags: [posts]
      summary: Unlike a post
      parameters:
        - name: postId
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Unliked

  /posts/{postId}/repost:
    post:
      operationId: repostPost
      tags: [posts]
      summary: Repost
      parameters:
        - name: postId
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Reposted

  /posts/{postId}/bookmark:
    post:
      operationId: bookmarkPost
      tags: [posts]
      summary: Bookmark a post
      parameters:
        - name: postId
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Bookmarked

  /posts/{postId}/comments:
    get:
      operationId: listComments
      tags: [comments]
      summary: Get comments for a post
      parameters:
        - name: postId
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Comments
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Comment"
    post:
      operationId: createComment
      tags: [comments]
      summary: Add a comment
      parameters:
        - name: postId
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CommentInput"
      responses:
        "201":
          description: Created comment
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Comment"

  /stories:
    get:
      operationId: listStories
      tags: [stories]
      summary: Get stories from followed users
      responses:
        "200":
          description: Stories grouped by user
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/UserStories"
    post:
      operationId: createStory
      tags: [stories]
      summary: Create a story
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/StoryInput"
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Story"

  /stories/upload:
    post:
      operationId: uploadStoryMedia
      tags: [stories]
      summary: Upload story image/video from gallery
      responses:
        "200":
          description: Media URL
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UploadResult"

  /stories/{storyId}/view:
    post:
      operationId: viewStory
      tags: [stories]
      summary: Mark story as viewed
      parameters:
        - name: storyId
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Viewed

  /chat/messages:
    get:
      operationId: listChatMessages
      tags: [chat]
      summary: Get general chat messages
      parameters:
        - name: before
          in: query
          schema:
            type: ["integer", "null"]
      responses:
        "200":
          description: Messages
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/ChatMessage"
    post:
      operationId: sendChatMessage
      tags: [chat]
      summary: Send text/gif message to general chat
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ChatMessageInput"
      responses:
        "201":
          description: Sent
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ChatMessage"

  /chat/voice:
    post:
      operationId: sendVoiceMessage
      tags: [chat]
      summary: Upload and send voice message to general chat
      responses:
        "201":
          description: Voice message sent
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ChatMessage"

  /voice-rooms:
    get:
      operationId: listVoiceRooms
      tags: [voice]
      summary: List active voice chat rooms
      responses:
        "200":
          description: Voice rooms
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/VoiceRoom"
    post:
      operationId: createVoiceRoom
      tags: [voice]
      summary: Create a voice room
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/VoiceRoomInput"
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/VoiceRoom"

  /voice-rooms/{roomId}:
    get:
      operationId: getVoiceRoom
      tags: [voice]
      summary: Get voice room details
      parameters:
        - name: roomId
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Voice room
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/VoiceRoom"

  /voice-rooms/{roomId}/join:
    post:
      operationId: joinVoiceRoom
      tags: [voice]
      summary: Join a voice room
      parameters:
        - name: roomId
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Joined

  /voice-rooms/{roomId}/leave:
    post:
      operationId: leaveVoiceRoom
      tags: [voice]
      summary: Leave a voice room
      parameters:
        - name: roomId
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Left

  /notifications:
    get:
      operationId: listNotifications
      tags: [notifications]
      summary: Get notifications for current user
      responses:
        "200":
          description: Notifications
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Notification"

  /notifications/read:
    post:
      operationId: markNotificationsRead
      tags: [notifications]
      summary: Mark all notifications as read
      responses:
        "200":
          description: Marked read

  /explore/trending:
    get:
      operationId: getTrending
      tags: [posts]
      summary: Get trending posts
      responses:
        "200":
          description: Trending posts
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Post"

  /explore/suggested-users:
    get:
      operationId: getSuggestedUsers
      tags: [users]
      summary: Get suggested users to follow
      responses:
        "200":
          description: Suggested users
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/User"

components:
  schemas:
    HealthStatus:
      type: object
      required: [status]
      properties:
        status:
          type: string

    LoginInput:
      type: object
      required: [username, password]
      properties:
        username:
          type: string
        password:
          type: string

    RegisterInput:
      type: object
      required: [username, email, password, displayName]
      properties:
        username:
          type: string
        email:
          type: string
        password:
          type: string
        displayName:
          type: string

    User:
      type: object
      required: [id, username, displayName, createdAt]
      properties:
        id:
          type: integer
        username:
          type: string
        displayName:
          type: string
        bio:
          type: ["string", "null"]
        avatarUrl:
          type: ["string", "null"]
        bannerUrl:
          type: ["string", "null"]
        role:
          type: string
        isBanned:
          type: boolean
        followerCount:
          type: integer
        followingCount:
          type: integer
        postCount:
          type: integer
        isFollowing:
          type: boolean
        createdAt:
          type: string

    UserProfile:
      type: object
      required: [id, username, displayName, createdAt, posts]
      properties:
        id:
          type: integer
        username:
          type: string
        displayName:
          type: string
        bio:
          type: ["string", "null"]
        avatarUrl:
          type: ["string", "null"]
        followerCount:
          type: integer
        followingCount:
          type: integer
        postCount:
          type: integer
        isFollowing:
          type: boolean
        createdAt:
          type: string
        posts:
          type: array
          items:
            $ref: "#/components/schemas/Post"

    ProfileUpdate:
      type: object
      properties:
        displayName:
          type: string
        bio:
          type: string

    UploadResult:
      type: object
      required: [url, type]
      properties:
        url:
          type: string
        type:
          type: string

    Post:
      type: object
      required: [id, userId, content, likeCount, commentCount, repostCount, createdAt]
      properties:
        id:
          type: integer
        userId:
          type: integer
        user:
          $ref: "#/components/schemas/User"
        content:
          type: string
        mediaUrl:
          type: ["string", "null"]
        mediaType:
          type: ["string", "null"]
        likeCount:
          type: integer
        commentCount:
          type: integer
        repostCount:
          type: integer
        isLiked:
          type: boolean
        isBookmarked:
          type: boolean
        isReposted:
          type: boolean
        createdAt:
          type: string

    PostInput:
      type: object
      required: [content]
      properties:
        content:
          type: string
        mediaUrl:
          type: ["string", "null"]
        mediaType:
          type: ["string", "null"]

    Comment:
      type: object
      required: [id, postId, userId, content, createdAt]
      properties:
        id:
          type: integer
        postId:
          type: integer
        userId:
          type: integer
        user:
          $ref: "#/components/schemas/User"
        content:
          type: string
        createdAt:
          type: string

    CommentInput:
      type: object
      required: [content]
      properties:
        content:
          type: string

    Story:
      type: object
      required: [id, userId, mediaUrl, createdAt, expiresAt]
      properties:
        id:
          type: integer
        userId:
          type: integer
        user:
          $ref: "#/components/schemas/User"
        mediaUrl:
          type: string
        mediaType:
          type: string
        isViewed:
          type: boolean
        createdAt:
          type: string
        expiresAt:
          type: string

    StoryInput:
      type: object
      required: [mediaUrl]
      properties:
        mediaUrl:
          type: string
        mediaType:
          type: string

    UserStories:
      type: object
      required: [user, stories, hasUnviewed]
      properties:
        user:
          $ref: "#/components/schemas/User"
        stories:
          type: array
          items:
            $ref: "#/components/schemas/Story"
        hasUnviewed:
          type: boolean

    ChatMessage:
      type: object
      required: [id, userId, type, createdAt]
      properties:
        id:
          type: integer
        userId:
          type: integer
        user:
          $ref: "#/components/schemas/User"
        type:
          type: string
          enum: [text, gif, voice]
        content:
          type: ["string", "null"]
        gifUrl:
          type: ["string", "null"]
        voiceUrl:
          type: ["string", "null"]
        voiceDuration:
          type: ["integer", "null"]
        createdAt:
          type: string

    ChatMessageInput:
      type: object
      required: [type]
      properties:
        type:
          type: string
          enum: [text, gif]
        content:
          type: ["string", "null"]
        gifUrl:
          type: ["string", "null"]

    VoiceRoom:
      type: object
      required: [id, name, createdBy, participantCount, isActive, createdAt]
      properties:
        id:
          type: integer
        name:
          type: string
        description:
          type: ["string", "null"]
        createdBy:
          type: integer
        host:
          $ref: "#/components/schemas/User"
        participantCount:
          type: integer
        participants:
          type: array
          items:
            $ref: "#/components/schemas/User"
        isActive:
          type: boolean
        isJoined:
          type: boolean
        createdAt:
          type: string

    VoiceRoomInput:
      type: object
      required: [name]
      properties:
        name:
          type: string
        description:
          type: ["string", "null"]

    Notification:
      type: object
      required: [id, type, isRead, createdAt]
      properties:
        id:
          type: integer
        type:
          type: string
          enum: [like, comment, follow, repost, mention]
        fromUser:
          $ref: "#/components/schemas/User"
        post:
          $ref: "#/components/schemas/Post"
        isRead:
          type: boolean
        createdAt:
          type: string
