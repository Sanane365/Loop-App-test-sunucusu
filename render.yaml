services:
  - type: web
    name: loop-app-test-sunucusu
    runtime: node
    plan: free
    region: frankfurt
    buildCommand: corepack enable && pnpm config set dangerouslyAllowAllBuilds true && pnpm install --frozen-lockfile && pnpm --filter @workspace/loop-app build && pnpm --filter @workspace/api-server build
    startCommand: pnpm --filter @workspace/db push && pnpm --filter @workspace/api-server start
    healthCheckPath: /api/healthz
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: loop-app-test-db
          property: connectionString
      - key: ADMIN_BOOTSTRAP_TOKEN
        generateValue: true

databases:
  - name: loop-app-test-db
    databaseName: loop_app_test
    user: loop_app
    plan: free
    region: frankfurt
